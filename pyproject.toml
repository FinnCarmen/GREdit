[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gredit"
version = "0.1.0"
description = "GenRecEdit: model editing for cold-start generative recommendation."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "GREdit Contributors" }
]
keywords = ["recommender-systems", "model-editing", "generative-recommendation", "cold-start", "tiger"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate==1.12.0",
  "datasets==2.21.0",
  "einops==0.8.1",
  "huggingface-hub==0.36.0",
  "hydra-core==1.3.2",
  "ipdb==0.13.13",
  "lightning==2.3.1",
  "matplotlib==3.10.3",
  "nltk==3.9.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "peft==0.18.0",
  "pyarrow==21.0.0",
  "PyYAML==6.0.3",
  "pytorch-lightning==2.6.0",
  "recbole==1.2.0",
  "requests==2.32.5",
  "rich==13.7.1",
  "safetensors==0.7.0",
  "scikit-learn==1.6.1",
  "scipy==1.14.1",
  "sentence-transformers==5.2.0",
  "tabulate==0.9.0",
  "tensorboard==2.20.0",
  "tokenizers==0.22.1",
  "tqdm==4.67.1",
  "transformers==4.57.0",
]

[project.optional-dependencies]
cu124 = [
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "torchvision==0.21.0",
  "triton==3.2.0",
]

[project.scripts]
gredit-train = "rec_main:main"
gredit-prepare = "prepare_edit_data:main"
gredit-edit = "genrecedit.utils:genrecedit_main"
gredit-summarize-results = "util.summarize_experiment_results:main"
gredit-sync-server184-results = "util.sync_server184_results:main"
gredit-build-experiment-summary = "util.build_experiment_summary:main"
gredit-sync-server184-runtime = "util.sync_server184_runtime_status:main"
gredit-refresh-latest-reporting = "util.refresh_latest_reporting:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["genrecedit", "genrec", "genrec.*", "util"]

[tool.setuptools.package-data]
genrec = ["*.yaml", "datasets/**/*.yaml", "models/**/*.yaml"]
